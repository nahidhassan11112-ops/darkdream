<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Dream</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b0b;
  color: white;
}

/* NAVBAR */
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  background: black;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 0 10px;
}

/* LOGO */
.logo {
  font-size: 35px;
  font-weight: bold;
  background: linear-gradient(90deg, red, orange);
  -webkit-background-clip: text;
  color: transparent;
}

/* HERO */
.hero {
  text-align: center;
  padding: 40px 20px;
}

.hero button {
  background: red;
  border: none;
  padding: 12px 25px;
  border-radius: 25px;
  color: white;
}

/* PRODUCTS GRID */
.products {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}

/* CARD */
.card {
  background: #111;
  border-radius: 15px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

/* INFO */
.card-body {
  padding: 10px;
  text-align: center;
}

.price {
  color: #ff4d4d;
  font-weight: bold;
}

/* BUTTON */
.buy {
  background: red;
  border: none;
  padding: 8px 15px;
  border-radius: 20px;
  color: white;
  margin-top: 8px;
}

/* CONTACT */
.contact {
  text-align: center;
  padding: 20px;
  background: #111;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
  <div class="logo">DARK DREAM</div>
  <div>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <h2>Premium Leather & Attar Brand</h2>
  <button onclick="whatsapp()">Order Now</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- CONTACT -->
<div class="contact">
  📞 01871480009 <br>
  ✉ darkdream046@gmail.com <br><br>

  <button onclick="whatsapp()" class="buy">Chat on WhatsApp</button>
</div>

<!-- SCRIPT -->
<script>
const sheetURL = "https://opensheet.elk.sh/1RkjoEhpycMSKp35hH_fr3ufzge3qgtjgpONslkfV-UY/Sheet1";

fetch(sheetURL)
  .then(res => res.json())
  .then(data => {
    let html = "";

    data.forEach(item => {
      html += `
        <div class="card">
          <img src="${item.Image}">
          <div class="card-body">
            <h3>${item.Name}</h3>
            <p class="price">${item.Price}৳</p>
            <a href="https://wa.me/8801871480009?text=I want ${item.Name}">
              <button class="buy">Buy Now</button>
            </a>
          </div>
        </div>
      `;
    });

    document.getElementById("products").innerHTML = html;
  });

function whatsapp(){
  window.open("https://wa.me/8801871480009");
}
</script>

</body>
</html>
