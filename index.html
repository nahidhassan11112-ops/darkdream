<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Dream</title>

<style>

/* BODY */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #000, #111);
  color: white;
  scroll-behavior: smooth;
}

/* NAVBAR */
nav {
  position: sticky;
  top: 0;
  background: rgba(0,0,0,0.8);
  padding: 15px;
  text-align: center;
  backdrop-filter: blur(10px);
  z-index: 1000;
}

nav a {
  color: #fff;
  margin: 0 15px;
  text-decoration: none;
  font-weight: bold;
}

/* HERO */
.hero {
  text-align: center;
  padding: 80px 20px;
}

.hero h1 {
  font-size: 40px;
  color: #ff4d4d;
}

.hero p {
  color: #bbb;
  margin-top: 10px;
}

/* BUTTON */
.btn {
  background: linear-gradient(45deg, #ff4d4d, red);
  padding: 12px 25px;
  border-radius: 30px;
  border: none;
  color: white;
  margin: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 15px red;
}

/* SECTION */
.section {
  padding: 50px 20px;
  text-align: center;
}

/* PRODUCTS GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  padding: 15px;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 20px rgba(255,77,77,0.6);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.price {
  color: #ff4d4d;
  font-weight: bold;
}

/* CONTACT */
.contact {
  background: #111;
  padding: 40px;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 15px;
  background: #000;
  color: #aaa;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav>
  <a href="#">Home</a>
  <a href="#products">Products</a>
  <a href="#contact">Contact</a>
</nav>

<!-- HERO -->
<div class="hero">
  <h1>🔥 DARK DREAM 🔥</h1>
  <p>Premium Leather & Attar Brand</p>

  <a href="https://wa.me/8801847678322?text=I%20want%20to%20order" target="_blank">
    <button class="btn">Order Now</button>
  </a>
</div>

<!-- PRODUCTS -->
<div class="section" id="products">
  <h2>Our Products</h2>

  <div class="grid">

    <div class="card">
      <img src="https://i.imgur.com/8Km9tLL.jpg">
      <h3>Premium Wallet</h3>
      <p class="price">1200৳</p>
      <a href="https://wa.me/8801847678322?text=I%20want%20Wallet" target="_blank">
        <button class="btn">Buy Now</button>
      </a>
    </div>

    <div class="card">
      <img src="https://i.imgur.com/3ZQ3Z6G.jpg">
      <h3>Luxury Attar</h3>
      <p class="price">500৳</p>
      <a href="https://wa.me/8801847678322?text=I%20want%20Attar" target="_blank">
        <button class="btn">Buy Now</button>
      </a>
    </div>

  </div>
</div>

<!-- CONTACT -->
<div class="contact" id="contact">
  <h2>Contact Us</h2>
  <p>📞 01847678322</p>
  <p>📧 darkdreamleather@gmail.com</p>

  <a href="https://wa.me/8801847678322" target="_blank">
    <button class="btn">Chat on WhatsApp</button>
  </a>
</div>

<!-- FOOTER -->
<footer>
  © 2026 Dark Dream | All Rights Reserved
</footer>

</body>
</html>
