<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BelieveMe Style Landing</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f8f8f8;
}

.container {
  max-width: 800px;
  margin: auto;
  background: #fff;
  padding: 20px;
}

/* Header */
.header {
  text-align: center;
}
.header img {
  width: 100%;
  border-radius: 10px;
}

/* Title */
h1 {
  font-size: 24px;
  text-align: center;
}

/* Price */
.price {
  text-align: center;
  font-size: 22px;
  color: green;
  margin: 10px 0;
}

/* Button */
.btn {
  display: block;
  text-align: center;
  background: #ff4d4d;
  color: white;
  padding: 15px;
  margin: 15px 0;
  text-decoration: none;
  border-radius: 5px;
  font-size: 18px;
}

/* Section */
.section {
  margin-top: 25px;
}

/* Features */
.features li {
  margin: 8px 0;
}

/* Review */
.review {
  background: #eee;
  padding: 10px;
  margin: 8px 0;
  border-radius: 5px;
}

/* Footer */
footer {
  text-align: center;
  margin-top: 20px;
  color: #777;
}
</style>

</head>

<body>

<div class="container">

  <!-- Image -->
  <div class="header">
    <img src="https://via.placeholder.com/800x400" alt="Product">
  </div>

  <!-- Title -->
  <h1>Premium Product Offer</h1>

  <!-- Price -->
  <div class="price">Only 999৳</div>

  <!-- Button -->
  <a class="btn" href="https://wa.me/8801XXXXXXXXX">Order Now</a>

  <!-- Features -->
  <div class="section">
    <h2>Product Features</h2>
    <ul class="features">
      <li>✔ High Quality</li>
      <li>✔ Long Lasting</li>
      <li>✔ Best Price</li>
      <li>✔ Fast Delivery</li>
    </ul>
  </div>

  <!-- Reviews -->
  <div class="section">
    <h2>Customer Reviews</h2>
    <div class="review">⭐⭐⭐⭐⭐ - Awesome product!</div>
    <div class="review">⭐⭐⭐⭐⭐ - Value for money</div>
    <div class="review">⭐⭐⭐⭐⭐ - Highly recommended</div>
  </div>

  <!-- CTA -->
  <a class="btn" href="https://wa.me/8801XXXXXXXXX">Order via WhatsApp</a>

  <footer>
    © 2026 All Rights Reserved
  </footer>

</div>

</body>
</html>
