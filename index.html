<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Dream</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Poppins;
  background:#0b0b0b;
  color:white;
}

/* NAV */
nav{
  display:flex;
  justify-content:center;
  gap:30px;
  padding:15px;
  background:black;
}
nav a{
  color:white;
  text-decoration:none;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px;
}
.hero h1{
  color:red;
  font-size:32px;
}
.btn{
  background:red;
  padding:10px 20px;
  border-radius:25px;
  color:white;
  display:inline-block;
  margin-top:10px;
}

/* PRODUCTS */
.products{
  display:flex;
  gap:20px;
  padding:20px;
}
.card{
  background:#111;
  border-radius:10px;
  overflow:hidden;
  flex:1;
  text-align:center;
}
.card img{
  width:100%;
}
.buy{
  background:red;
  padding:8px 15px;
  border-radius:20px;
  display:inline-block;
  margin:10px;
}

/* CONTACT */
.contact{
  text-align:center;
  padding:30px;
}

</style>
</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#">Products</a>
  <a href="#">Contact</a>
</nav>

<div class="hero">
  <h1>🔥 DARK DREAM 🔥</h1>
  <p>Luxury Leather & Attar Brand</p>
  <div class="btn">Order Now</div>
</div>

<div class="products">

  <div class="card">
    <img src="https://picsum.photos/400/300?random=1">
    <h3>Wallet</h3>
    <p>1200৳</p>
    <div class="buy">Buy Now</div>
  </div>

  <div class="card">
    <img src="https://picsum.photos/400/300?random=2">
    <h3>Attar</h3>
    <p>500৳</p>
    <div class="buy">Buy Now</div>
  </div>

</div>

<div class="contact">
  <p>📞 01871480009</p>
  <p>📧 darkdream046@gmail.com</p>
</div>

</body>
</html>
