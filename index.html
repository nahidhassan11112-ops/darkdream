<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Dream</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
  text-align:center;
}

nav{
  padding:10px;
  background:#111;
}

nav a{
  color:white;
  margin:10px;
  text-decoration:none;
}

h1{
  color:#ff3c3c;
}

.btn{
  background:#ff3c3c;
  padding:10px 20px;
  border:none;
  color:white;
  border-radius:20px;
}

#products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:#111;
  padding:15px;
  border-radius:15px;
}

.card img{
  width:100%;
  border-radius:10px;
}

footer{
  margin-top:20px;
  padding:10px;
  background:#111;
}
</style>
</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#">Products</a>
  <a href="#">Contact</a>
</nav>

<h1>🔥 DARK DREAM 🔥</h1>
<p>Premium Leather & Attar Brand</p>

<button class="btn">Order Now</button>

<h2>Our Products</h2>

<div id="products"></div>

<h3>Contact Us</h3>
<p>📞 01847678322</p>
<p>📧 darkdreamleather@gmail.com</p>

<button class="btn" onclick="whatsapp()">Chat on WhatsApp</button>

<footer>
© 2026 Dark Dream | All Rights Reserved
</footer>

<script>
fetch("https://opensheet.elk.sh/1RkjoEhpycMSKp35hH_fr3ufzge3qgtjgpONslkfV-UY/Sheet1")
.then(res => res.json())
.then(data => {
  let container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(item => {
    container.innerHTML += `
    <div class="card">
      <img src="${item.Image}">
      <h3>${item.Name}</h3>
      <p>${item.Price}৳</p>
      <button class="btn" onclick="order('${item.Name}')">Buy Now</button>
    </div>
    `;
  });
});

function order(product){
  window.open("https://wa.me/8801847678322?text=I want to order " + product);
}

function whatsapp(){
  window.open("https://wa.me/8801847678322");
}
</script>

</body>
</html>

<script>
const sheetURL = "https://opensheet.elk.sh/1RkjoEhpycMSKp35hH_fr3ufzge3qgtjgpONslkfV-UY/Sheet1";

fetch(sheetURL)
  .then(res => res.json())
  .then(data => {
    let html = "";

    data.forEach(item => {
      html += `
        <div class="product-card">
          <img src="${item.Image}" alt="${item.Name}">
          <h3>${item.Name}</h3>
          <p>${item.Price}৳</p>
          <button>Buy Now</button>
        </div>
      `;
    });

    document.getElementById("products").innerHTML = html;
  });
</script>
