<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Dream</title>

<style>
body{margin:0;background:#0a0a0a;color:white;font-family:sans-serif}

/* HEADER */
header{display:flex;justify-content:space-between;padding:15px;background:#111}
header h2{color:red}

/* HERO */
.hero{text-align:center;padding:40px}
.btn{
  background:red;
  padding:12px 25px;
  border-radius:20px;
  display:inline-block;
  margin-top:10px;
  cursor:pointer;
}

/* GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#111;border-radius:10px;overflow:hidden;text-align:center}
.card img{width:100%}
.price{color:red}

/* BUTTON */
button{
  background:red;
  border:none;
  padding:10px;
  border-radius:20px;
  color:white;
  margin-bottom:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
<h2>DARK DREAM</h2>
</header>

<!-- HERO -->
<div class="hero">
<h1>Accessories For Every Connection</h1>
<div class="btn" onclick="goProducts()">Shop Now</div>
</div>

<!-- PRODUCTS -->
<div id="products" class="grid">

<div class="card">
<img src="https://picsum.photos/300?1">
<h3>Charger</h3>
<p class="price">500৳</p>
<button onclick="order('Charger',500)">Buy Now</button>
</div>

<div class="card">
<img src="https://picsum.photos/300?2">
<h3>Wallet</h3>
<p class="price">1200৳</p>
<button onclick="order('Wallet',1200)">Buy Now</button>
</div>

</div>

<script>

// BUY NOW → WhatsApp order
function order(name,price){
  let msg = `Order Details:%0AProduct: ${name}%0APrice: ${price}৳`;
  window.open(`https://wa.me/8801871480009?text=${msg}`);
}

// SHOP NOW → scroll to products
function goProducts(){
  document.getElementById("products").scrollIntoView({behavior:"smooth"});
}

</script>

</body>
</html>
